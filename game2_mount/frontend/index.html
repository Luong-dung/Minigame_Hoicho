<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bắt chuột dưới cốc</title>
  <style>
    :root {
      color-scheme: light;
      font-family: "Segoe UI", sans-serif;
      color: #33251b;
      background: #fff7e8;
    }
    * { box-sizing: border-box; }
    body {
      display: grid;
      min-height: 100vh;
      margin: 0;
      place-items: center;
      padding: 24px;
      background: radial-gradient(circle at top, #fffdf6, #ffe7bb);
    }
    main {
      width: min(760px, 100%);
      padding: clamp(24px, 5vw, 48px);
      text-align: center;
      background: #fff;
      border: 1px solid #f1d49e;
      border-radius: 28px;
      box-shadow: 0 18px 50px #9b681d22;
    }
    h1 { margin: 0 0 8px; font-size: clamp(2rem, 6vw, 3.4rem); }
    .subtitle { margin: 0 auto 28px; color: #765d46; font-size: 1.05rem; }
    .stats { display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; margin-bottom: 26px; }
    .stat { min-width: 130px; padding: 10px 16px; background: #fff4d9; border-radius: 14px; }
    .stat strong { display: block; font-size: 1.4rem; color: #bd5e16; }
    .mode-picker { margin: 0 auto 20px; }
    .mode-picker label { display: block; margin-bottom: 8px; font-weight: 700; }
    .mode-picker select { margin-bottom: 12px; padding: 9px 12px; border: 1px solid #e0b875; border-radius: 10px; font: inherit; }
    .cups {
      display: flex;
      align-items: flex-start;
      justify-content: center;
      gap: clamp(4px, 1.6vw, 24px);
      margin: 24px 0;
      --count: 6;
    }
    .cup {
      position: relative;
      flex: 0 1 145px;
      min-width: 0;
      aspect-ratio: .9;
      border: 0;
      border-radius: 48% 48% 42% 42%;
      cursor: pointer;
      background: linear-gradient(105deg, #dc6b2f 5%, #f89943 45%, #c44c22 100%);
      box-shadow: inset -10px -12px 0 #9f351b44, 0 10px 0 #be692e;
      transition: transform .18s, filter .18s;
    }
    .cup::before {
      content: "";
      position: absolute;
      left: -5%;
      top: -9%;
      width: 110%;
      height: 25%;
      border-radius: 50%;
      background: #ffbd64;
      box-shadow: inset 0 -6px 0 #a9481f66;
    }
    .cup:hover:not(:disabled) { transform: translateY(-8px); filter: brightness(1.08); }
    .cup:disabled { cursor: default; }
    .cup.opened { transform: translateY(-22px); filter: brightness(1.1); }
    .cup .mouse {
      display: none;
      position: absolute;
      inset: 22% 0 auto;
      font-size: calc(min(100vw, 760px) * .6 / var(--count));
      line-height: 1;
    }
    .cup.show-mouse .mouse { display: block; }
    .cup.show-mouse { background: #f4b05f; }
    .cup-number { position: absolute; bottom: 10%; left: 0; right: 0; color: white; font-weight: 700; font-size: clamp(14px, 3vw, 24px); }
    #movement { font-weight: 700; color: #bd5e16; }
    #message {
      min-height: 30px;
      margin: 18px 0;
      font-size: 1.15rem;
      font-weight: 700;
      color: #8d4a22;
    }
    #message.success { color: #18804b; }
    #message.error { color: #b52d2d; }
    #message.lose { color: #a34b20; }
    button.new-game {
      padding: 12px 24px;
      border: 0;
      border-radius: 12px;
      color: #fff;
      background: #23764f;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }
    button.new-game:hover { background: #185e3e; }
    .hint { margin-top: 22px; color: #8a7159; font-size: .92rem; }
  </style>
</head>
<body>
  <main>
    <h1>🐭 Bắt chuột dưới cốc</h1>
    <p class="subtitle">Chọn bậc độ khó và bắt chuột trước khi hết lượt!</p>
    <section class="stats" aria-label="Thông tin ván chơi">
      <div class="stat">Lượt mở <strong id="moves">0</strong></div>
      <div class="stat">Số cốc <strong id="cup-count">0</strong></div>
      <div class="stat">Tối đa <strong id="max-moves">0</strong></div>
    </section>
    <div class="mode-picker">
      <label for="level">Bậc độ khó</label>
      <select id="level">
        <option value="1">1 — Chuột thường · 5 cốc · 4 lượt</option>
        <option value="2">2 — Chuột thông minh · 8 cốc · 12 lượt</option>
        <option value="3">3 — Chuột trùm · 8 cốc · 13 lượt</option>
        <option value="4">4 — Chuột siêu trùm · 8 cốc · 14 lượt</option>
        <option value="5">Đặc biệt — Chuột đào tẩu · 7 cốc · 10 lần săn</option>
      </select>
      <p id="rules" class="hint"></p>
      <p id="movement" role="status"></p>
    </div>
    <section id="cups" class="cups" aria-label="Các chiếc cốc"></section>
    <p id="message" role="status">Chuột đang trốn. Bạn chọn cốc nào?</p>
    <button class="new-game" type="button" id="hunt" hidden>🔎 Máy săn — mở cốc tiếp theo</button>
    <button class="new-game" type="button" id="new-game">🔄 Chơi ván mới</button>
    <p class="hint">Cốc được đánh số từ trái sang phải. Chuột chỉ di chuyển sau mỗi lần mở trượt.</p>
  </main>
  <script>
    const cupsElement = document.querySelector("#cups");
    const movesElement = document.querySelector("#moves");
    const cupCountElement = document.querySelector("#cup-count");
    const maxMovesElement = document.querySelector("#max-moves");
    const levelElement = document.querySelector("#level");
    const rulesElement = document.querySelector("#rules");
    const movementElement = document.querySelector("#movement");
    const messageElement = document.querySelector("#message");
    const newGameButton = document.querySelector("#new-game");
    const huntButton = document.querySelector("#hunt");
    let escapeState = null;

    let cupCount = 0;   // số cốc của ván hiện tại
    let epoch = 0;      // tăng mỗi khi bắt đầu ván mới, để bỏ qua phản hồi cũ
    let finished = false;
    let busy = false;   // đang chờ server trả lời một lượt mở cốc

    function renderCups(count, openedCup = null, mousePosition = null, finished = false) {
      cupsElement.style.setProperty("--count", count);
      cupsElement.replaceChildren();
      for (let index = 0; index < count; index += 1) {
        const button = document.createElement("button");
        button.className = "cup";
        button.type = "button";
        button.setAttribute("aria-label", `${escapeState ? "Trốn tại" : "Mở"} cốc ${index + 1}`);
        if (index === openedCup) button.classList.add("opened");
        if (index === mousePosition) button.classList.add("show-mouse");
        button.disabled = finished;
        button.innerHTML = `<span class="mouse" aria-hidden="true">🐭</span><span class="cup-number">${index + 1}</span>`;
        button.addEventListener("click", () => openCup(index));
        cupsElement.append(button);
      }
    }

    function showMessage(text, kind = "") {
      messageElement.textContent = text;
      messageElement.className = kind;
    }

    async function readJson(url, options = {}) {
      const response = await fetch(url, options);
      let data = {};
      try {
        data = await response.json();
      } catch {
        // phản hồi không phải JSON
      }
      if (!response.ok) throw new Error(data.error || "Không thể kết nối máy chủ.");
      return data;
    }

    function setBusy(value) {
      busy = value;
      newGameButton.disabled = value;
      levelElement.disabled = value;
      cupsElement.querySelectorAll("button").forEach(button => {
        button.disabled = value || finished;
      });
      if (escapeState) updateEscapeControls();
    }

    function updateEscapeControls() {
      huntButton.hidden = !escapeState;
      huntButton.disabled = busy || finished || escapeState?.escape_phase !== "hunt";
      if (!escapeState) return;
      cupsElement.querySelectorAll("button").forEach((button, index) => {
        button.disabled = busy || finished || !(escapeState.escape_phase === "choose"
          || escapeState.escape_phase === "move" && escapeState.legal_moves.includes(index));
      });
    }

    function renderEscape(state) {
      escapeState = state;
      finished = state.finished;
      movesElement.textContent = state.moves;
      renderCups(state.cup_count, state.hunter_cup, state.mouse_position, state.finished);
      movementElement.textContent = state.finished ? "Ván chơi đã kết thúc."
        : state.escape_phase === "choose" ? "Chọn cốc để trốn ban đầu."
        : state.escape_phase === "move" ? "Bạn phải chạy đúng 1 ô sang trái hoặc phải."
        : "Bạn đã trốn. Bấm Máy săn để xem máy mở cốc nào.";
      showMessage(state.message || "Bạn là chuột! Chọn chỗ trốn đầu tiên.", state.finished ? state.won ? "success" : "lose" : "");
      updateEscapeControls();
    }

    async function escapeAction(action, cup) {
      if (busy || finished) return;
      setBusy(true);
      try {
        renderEscape(await readJson("/api/escape", {
          method: "POST", headers: {"Content-Type": "application/json"},
          body: JSON.stringify({action, cup})
        }));
      } catch (error) { showMessage(error.message, "error"); }
      finally { setBusy(false); }
    }

    function showMovement(step) {
      movementElement.textContent = step == null
        ? "Ván chơi đã kết thúc."
        : `Nếu lần mở tiếp theo trượt, chuột sẽ đi ${step} ô.`;
    }

    async function openCup(cup) {
      if (busy || finished) return;
      if (escapeState) {
        const phase = escapeState.escape_phase;
        if (phase === "choose" || phase === "move") await escapeAction(phase, cup);
        return;
      }
      setBusy(true);
      const myEpoch = epoch;
      try {
        const result = await readJson("/api/open", {
          method: "POST",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify({cup})
        });
        if (myEpoch !== epoch) return; // ván đã bị reset trong lúc chờ
        movesElement.textContent = result.moves;
        finished = result.finished;
        showMovement(result.next_step);
        if (result.finished) {
          renderCups(cupCount, result.opened_cup, result.mouse_position, true);
          showMessage(result.message, result.won ? "success" : "lose");
        } else {
          renderCups(cupCount, result.opened_cup);
          showMessage(result.message);
        }
      } catch (error) {
        if (myEpoch === epoch) showMessage(error.message, "error");
      } finally {
        if (myEpoch === epoch) setBusy(false);
      }
    }

    async function startNewGame() {
      if (busy) return;
      setBusy(true);
      epoch += 1;
      const myEpoch = epoch;
      try {
        const state = await readJson("/api/new-game", {
          method: "POST",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify({
            level: Number(levelElement.value)
          })
        });
        if (myEpoch !== epoch) return;
        cupCount = state.cup_count;
        finished = state.finished;
        escapeState = state.mode === "escape" ? state : null;
        huntButton.hidden = !escapeState;
        movesElement.textContent = state.moves;
        cupCountElement.textContent = state.cup_count;
        maxMovesElement.textContent = state.max_moves;
        if (escapeState) {
          rulesElement.textContent = "Bạn làm chuột: chọn chỗ trốn trong 7 cốc và sống sót qua 10 lần săn để thắng. Sau mỗi lần thoát, bạn phải chạy 1 ô liền kề.";
          renderEscape(state);
          return;
        }
        showMovement(state.next_step);
        rulesElement.textContent = state.level === 1
          ? "Chuột đi ngẫu nhiên sang một ô liền kề. Ở đầu hàng, chuột quay vào trong."
          : state.level >= 3
            ? `Chuột né khi còn đường thoát. Sau mỗi lần trượt, đi theo chu kỳ ${state.movement_pattern.join(" → ")} ô; chọn một hướng và bật ngược khi chạm biên. Muốn thắng, hãy ép chuột về một vị trí.`
            : "Chuột né khi còn đường thoát và đi đúng một ô liền kề sau mỗi lần trượt. Ở đầu hàng, chuột quay vào trong. Muốn thắng, hãy ép chuột về một vị trí.";
        movesElement.textContent = state.moves;
        cupCountElement.textContent = state.cup_count;
        maxMovesElement.textContent = state.max_moves;
        renderCups(state.cup_count);
        showMessage("Chuột đang trốn. Bạn chọn cốc nào?");
      } catch (error) {
        if (myEpoch === epoch) showMessage(error.message, "error");
      } finally {
        if (myEpoch === epoch) setBusy(false);
      }
    }

    newGameButton.addEventListener("click", startNewGame);
    huntButton.addEventListener("click", () => escapeAction("hunt"));
    levelElement.addEventListener("change", startNewGame);
    startNewGame();
  </script>
</body>
</html>
