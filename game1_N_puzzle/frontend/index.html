<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Image Sliding Puzzle</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; color: #f5f7ff;
      background: radial-gradient(circle at top, #243b68, #101523 65%);
    }
    main { width: min(1100px, 94vw); margin: auto; padding: 28px 0 42px; }
    h1 { margin: 0 0 6px; font-size: clamp(1.8rem, 4vw, 2.8rem); }
    .subtitle { margin: 0 0 22px; color: #bbc7e6; }
    .layout { display: grid; grid-template-columns: 270px minmax(0, 1fr); gap: 24px; align-items: start; }
    .panel, .game-card {
      border: 1px solid #3e527e; border-radius: 18px; background: #17223aee;
      box-shadow: 0 14px 35px #0004;
    }
    .panel { padding: 18px; }
    label { display: block; margin: 0 0 7px; color: #cbd5f5; font-size: .9rem; }
    select, button {
      width: 100%; border: 1px solid #526a9e; border-radius: 9px; padding: 10px;
      background: #202e4b; color: inherit; font: inherit; cursor: pointer;
    }
    select { margin-bottom: 15px; }
    button { background: #5b6ee1; border: 0; font-weight: 700; }
    button:hover { background: #7484f0; }
    button:disabled, select:disabled { cursor: default; opacity: .65; }
    .tile:disabled { opacity: 1; }
    #timer { font-variant-numeric: tabular-nums; }
    button.secondary { margin-top: 9px; background: #293957; }
    button.random { margin-top: 9px; background: #3d5f91; }
    .stats { display: flex; justify-content: space-between; margin: 20px 0 0; color: #bdc9e9; }
    .stats strong { display: block; color: white; font-size: 1.15rem; }
    .game-card { padding: clamp(12px, 3vw, 24px); }
    #message { min-height: 25px; margin: 0 0 12px; color: #cbd5f5; }
    #message.success { color: #76e6ae; font-weight: 700; }
    #message.surrendered {
      color: #ffd166; font-size: clamp(1.4rem, 4vw, 2.4rem);
      font-weight: 800; text-align: center;
    }
    #board {
      --board-ratio: 1;
      display: grid; width: min(100%, 760px); margin: auto; overflow: hidden;
      aspect-ratio: var(--board-ratio); border: 3px solid #8296d7; border-radius: 12px;
      background: #0b1120; gap: 2px;
    }
    .board-area { position: relative; }
    .hint-button {
      position: absolute; top: 10px; right: 10px; z-index: 2;
      width: auto; padding: 7px 9px; font-size: .8rem;
      background: #293957;
    }
    .hint-button:hover { background: #3b4d72; }
    .hint-preview {
      display: none; position: absolute; top: 52px; right: 10px; z-index: 3;
      width: min(260px, 60%); border: 1px solid #526a9e; border-radius: 8px;
      overflow: hidden; background: #0b1120; box-shadow: 0 8px 24px #0008;
    }
    .hint-preview.visible { display: block; }
    .hint-preview img { display: block; width: 100%; height: auto; }
    .tile { min-width: 0; min-height: 0; padding: 0; border: 0; border-radius: 0;
      background: #243250; overflow: hidden; transition: transform .12s, filter .12s; }
    .tile:not(.empty):hover { filter: brightness(1.18); }
    .tile img { display: block; width: 100%; height: 100%; object-fit: fill; pointer-events: none; }
    .tile.covered {
      background: repeating-linear-gradient(45deg, #243250 0, #243250 12px, #304365 12px, #304365 24px);
      box-shadow: inset 0 0 0 2px #526a9e;
    }
    .tile.covered::after { content: "?"; color: #bbc7e6; font-size: clamp(2rem, 6vw, 4rem); }
    .tile.empty {
      position: relative; display: grid; place-items: center;
      background: repeating-linear-gradient(
        135deg, #101a30 0, #101a30 8px, #182744 8px, #182744 16px
      );
      box-shadow: inset 0 0 0 3px #8296d7;
      cursor: default;
    }
    .tile.empty::after {
      content: "Ô TRỐNG"; padding: 5px 8px; border: 1px solid #aebcf0;
      border-radius: 5px; background: #090e1bcc; color: #e5eaff;
      font-size: clamp(.55rem, 1.5vw, .8rem); font-weight: 800;
      letter-spacing: .04em; text-align: center; text-shadow: 0 1px 2px #000;
    }
    .hint { margin: 12px 0 0; text-align: center; color: #9eadd0; font-size: .85rem; }
    @media (max-width: 720px) {
      .layout { grid-template-columns: 1fr; }
      .panel { order: 2; }
      .game-card { order: 1; }
      .hint-preview { width: min(220px, 70%); }
    }
  </style>
</head>
<body>
<main>
  <h1>Image Sliding Puzzle</h1>
  <p class="subtitle">Chọn ảnh, rồi đưa các mảnh về đúng vị trí bằng cách di chuyển ô trống.</p>
  <div class="layout">
    <aside class="panel">
      <label for="imageSelect">Ảnh</label>
      <select id="imageSelect" aria-label="Chọn ảnh"></select>
      <label for="difficulty">Độ khó</label>
      <select id="difficulty">
        <option value="easy">Dễ · 3×3 · 60 giây</option>
        <option value="medium">Trung bình · 3×3 · 90 giây</option>
        <option value="hard">Khó · 3×4 · 120 giây</option>
        <option value="very-hard">Rất khó · 4×4 · 180 giây</option>
        <option value="blackout">Đặc biệt: Tắt đèn · 3×3 · 90 giây</option>
      </select>
      <button id="newGame" disabled>Bắt đầu</button>
      <button class="random" id="randomImage">Ảnh ngẫu nhiên</button>
      <button class="secondary" id="surrender">Đầu hàng</button>
      <div class="stats">
        <div><small>Nước đi</small><strong id="moves">0</strong></div>
        <div><small>Còn lại</small><strong id="timer">00:00</strong></div>
      </div>
    </aside>
    <section class="game-card">
      <p id="message" role="status" aria-live="polite">Đang tải danh sách ảnh…</p>
      <div class="board-area">
        <div id="board" aria-label="Bàn chơi xếp hình"></div>
        <button class="hint-button" id="showHint" type="button" aria-label="Xem gợi ý ảnh">Gợi ý (còn 3)</button>
        <div class="hint-preview" id="hintPreview" aria-hidden="true">
          <img id="hintImage" alt="Ảnh gốc của màn chơi">
        </div>
      </div>
      <p class="hint">Xem ảnh trước khi bắt đầu. Dùng chuột hoặc phím mũi tên để di chuyển ô trống; mỗi ván có 3 gợi ý, mỗi lần 3 giây.</p>
    </section>
  </div>
</main>
<script src="/frontend/puzzle.js"></script>
<script src="/frontend/game.js"></script>
</body>
</html>
